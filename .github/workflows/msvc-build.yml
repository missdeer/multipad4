name: MSVC Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: MSVC x64 Release (${{ matrix.simd }})
    runs-on: windows-2022
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        simd: [SSE4.2, AVX2, AVX512]

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up MSVC x64
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x64

      - name: Configure Release build
        run: cmake --preset msvc-x64 -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF "-DMULTIPAD4_SIMD=${{ matrix.simd }}"

      - name: Build multipad4
        run: cmake --build --preset msvc-x64 --target multipad4 --parallel 2

      - name: Upload executable
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: multipad4-msvc-x64-${{ matrix.simd }}
          path: |
            cmake-msvc-build/multipad4.exe
            cmake-msvc-build/Notepad4 DarkTheme.ini
          if-no-files-found: error
