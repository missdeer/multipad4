name: Windows Build

on:
  push:
    branches: ['**']
    tags: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.toolchain.name }} x64 Release (${{ matrix.simd }})
    runs-on: windows-2022
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        simd: [SSE4.2, AVX2, AVX512]
        toolchain:
          - { name: MSVC, id: msvc, cxx: cl, rc: rc }
          - { name: Clang-CL, id: clang-cl, cxx: clang-cl, rc: llvm-rc }
          - { name: oneAPI, id: oneapi, cxx: icx, rc: rc }

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up MSVC x64
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x64

      - name: Set up Clang-CL
        if: matrix.toolchain.id == 'clang-cl'
        run: |
          $llvmBin = Join-Path $env:ProgramFiles 'LLVM/bin'
          if (!(Test-Path "$llvmBin/clang-cl.exe") -or !(Test-Path "$llvmBin/llvm-rc.exe")) {
            throw "The runner's LLVM installation is incomplete: $llvmBin"
          }
          $llvmBin >> $env:GITHUB_PATH

      - name: Install Intel oneAPI C++ compiler
        if: matrix.toolchain.id == 'oneapi'
        env:
          # Pinned installer and component from Intel's oneapi-ci samples.
          ONEAPI_INSTALLER_URL: https://registrationcenter-download.intel.com/akdlm/IRC_NAS/728c4418-1b40-47a9-ad51-31530fb27c94/intel-oneapi-toolkit-2026.2.0.661_offline.exe
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'oneapi-installer.exe'
          curl.exe --fail --location --retry 5 --output $installer $env:ONEAPI_INSTALLER_URL
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $installProcess = Start-Process -FilePath $installer -WindowStyle Hidden -Wait -PassThru -ArgumentList @(
            '-s', '-a', '--silent', '--eula', 'accept',
            '--components', 'intel.oneapi.win.cpp-dpcpp-common',
            '-p=NEED_VS2022_INTEGRATION=0'
          )
          if ($installProcess.ExitCode -notin @(0, 3010)) {
            throw "oneAPI installation failed with exit code $($installProcess.ExitCode)"
          }

      - name: Configure and build multipad4
        shell: cmd
        run: |
          if "${{ matrix.toolchain.id }}"=="oneapi" (
            call "C:\Program Files (x86)\Intel\oneAPI\compiler\latest\env\vars.bat" vs2022
            if errorlevel 1 exit /b 1
          )
          cmake -S . -B cmake-${{ matrix.toolchain.id }}-build -G Ninja -DCMAKE_CXX_COMPILER=${{ matrix.toolchain.cxx }} -DCMAKE_RC_COMPILER=${{ matrix.toolchain.rc }} -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF "-DMULTIPAD4_SIMD=${{ matrix.simd }}"
          if errorlevel 1 exit /b 1
          cmake --build cmake-${{ matrix.toolchain.id }}-build --target multipad4 --parallel 2
          if errorlevel 1 exit /b 1

      - name: Include Intel runtime libraries
        if: matrix.toolchain.id == 'oneapi'
        run: |
          $compilerBin = 'C:/Program Files (x86)/Intel/oneAPI/compiler/latest/bin'
          Copy-Item "$compilerBin/libmmd.dll", "$compilerBin/svml_dispmd.dll" cmake-oneapi-build/ -ErrorAction Stop

      - name: Verify bundled plugins
        run: |
          foreach ($name in @('Matepath', 'OpenDocuments')) {
            $plugin = "cmake-${{ matrix.toolchain.id }}-build/plugins/$name/$name.dll"
            if (!(Test-Path -LiteralPath $plugin -PathType Leaf)) {
              throw "The bundled plugin is missing: $plugin"
            }
            $version = (Get-Item -LiteralPath $plugin).VersionInfo
            if (!$version.FileVersion -or !$version.FileDescription) {
              throw "The plugin version or description is missing: $plugin"
            }
          }

      - name: Upload executable
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: multipad4-${{ matrix.toolchain.id }}-x64-${{ matrix.simd }}
          path: |
            cmake-${{ matrix.toolchain.id }}-build/multipad4.exe
            cmake-${{ matrix.toolchain.id }}-build/MultiPad4 DarkTheme.ini
            cmake-${{ matrix.toolchain.id }}-build/*.dll
            cmake-${{ matrix.toolchain.id }}-build/plugins/OpenDocuments/OpenDocuments.dll
            cmake-${{ matrix.toolchain.id }}-build/plugins/OpenDocuments/THIRD_PARTY.md
            cmake-${{ matrix.toolchain.id }}-build/plugins/Matepath/Matepath.dll
            cmake-${{ matrix.toolchain.id }}-build/plugins/Matepath/THIRD_PARTY.md
            cmake-${{ matrix.toolchain.id }}-build/plugins/Matepath/Matepath.License.txt
          if-no-files-found: error

  mingw:
    name: ${{ matrix.toolchain.name }} x64 Release (${{ matrix.simd }})
    runs-on: windows-2022
    timeout-minutes: 45
    defaults:
      run:
        shell: msys2 {0}
    strategy:
      fail-fast: false
      matrix:
        simd: [SSE4.2, AVX2, AVX512]
        toolchain:
          - { name: MINGW64 GCC, id: mingw64, msystem: MINGW64, prefix: mingw-w64-x86_64, cxx: g++, compiler: gcc }
          - { name: MINGW64 Clang, id: mingw64-clang, msystem: MINGW64, prefix: mingw-w64-x86_64, cxx: clang++, compiler: clang }
          - { name: UCRT64 GCC, id: ucrt64, msystem: UCRT64, prefix: mingw-w64-ucrt-x86_64, cxx: g++, compiler: gcc }
          - { name: UCRT64 Clang, id: ucrt64-clang, msystem: UCRT64, prefix: mingw-w64-ucrt-x86_64, cxx: clang++, compiler: clang }
          - { name: CLANG64, id: clang64, msystem: CLANG64, prefix: mingw-w64-clang-x86_64, cxx: clang++, compiler: clang }

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up MSYS2 toolchain
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        with:
          msystem: ${{ matrix.toolchain.msystem }}
          update: true
          install: >-
            ${{ matrix.toolchain.prefix }}-${{ matrix.toolchain.compiler }}
            ${{ matrix.toolchain.prefix }}-binutils
            ${{ matrix.toolchain.prefix }}-cmake
            ${{ matrix.toolchain.prefix }}-ninja
            ${{ matrix.toolchain.prefix }}-python

      - name: Configure Release build
        run: >-
          cmake -S . -B cmake-${{ matrix.toolchain.id }}-build -G Ninja
          -DCMAKE_CXX_COMPILER=${{ matrix.toolchain.cxx }} -DCMAKE_RC_COMPILER=windres
          -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF
          -DMULTIPAD4_SIMD=${{ matrix.simd }}

      - name: Build multipad4
        run: cmake --build cmake-${{ matrix.toolchain.id }}-build --target multipad4 --parallel 2

      - name: Set up mingwdeployqt
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'mingwdeployqt.zip'
          $destination = Join-Path $env:RUNNER_TEMP 'mingwdeployqt'
          curl.exe --fail --location --retry 5 --output $archive https://github.com/missdeer/mingwdeployqt/releases/download/v1.2/mingwdeployqt-clang64-clang.zip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash -ne 'BF1A7F20B6B3BF630EFDA169C113DE11DEE21BE18452C676E115294A1DAC6838') {
            throw 'mingwdeployqt archive checksum mismatch'
          }
          Expand-Archive -LiteralPath $archive -DestinationPath $destination -Force
          "MINGWDEPLOYQT=$destination/bin/mingwdeployqt.exe" >> $env:GITHUB_ENV

      - name: Package executable and runtime libraries
        timeout-minutes: 5
        run: |
          set -euo pipefail
          build_dir="cmake-${{ matrix.toolchain.id }}-build"
          plugin="$build_dir/plugins/Matepath/Matepath.dll"
          documents_plugin="$build_dir/plugins/OpenDocuments/OpenDocuments.dll"
          mkdir -p "$build_dir/package/plugins/OpenDocuments"
          cp "$build_dir/plugins/OpenDocuments/THIRD_PARTY.md" "$build_dir/package/plugins/OpenDocuments/"
          mkdir -p "$build_dir/package/plugins/Matepath"
          cp "$build_dir/multipad4.exe" "$build_dir/MultiPad4 DarkTheme.ini" "$build_dir/package/"
          cp "$build_dir/plugins/Matepath/THIRD_PARTY.md" \
            "$build_dir/plugins/Matepath/Matepath.License.txt" "$build_dir/package/plugins/Matepath/"
          # Stage plugins beside the EXE so their runtime DLLs land in the same directory.
          cp "$plugin" "$documents_plugin" "$build_dir/package/"
          # Read PE imports without loading target code, including AVX512 builds.
          # mingwdeployqt also scans DLLs beside the EXE, including both plugins.
          "$(cygpath -u "$MINGWDEPLOYQT")" -d "$(cygpath -m "$MINGW_PREFIX/bin")" \
            "$build_dir/package/multipad4.exe" 2>&1 | tee "$build_dir/runtime-dependencies.txt"
          # mingwdeployqt can return success for missing imports or failed copies.
          system_dir="$(cygpath -S)"
          for binary in "$build_dir/package/multipad4.exe" "$build_dir/package/"*.dll; do
            objdump -p "$binary" | awk '/DLL Name:/ {print $3}' |
              while IFS= read -r dll; do
                case "${dll,,}" in api-ms-win-*|ext-ms-win-*) continue ;; esac
                if [[ ! -f "$build_dir/package/$dll" && ! -f "$system_dir/$dll" ]]; then
                  echo "$binary: unresolved runtime dependency $dll" >&2
                  exit 1
                fi
              done
          done
          mv "$build_dir/package/Matepath.dll" "$build_dir/package/plugins/Matepath/"
          mv "$build_dir/package/OpenDocuments.dll" "$build_dir/package/plugins/OpenDocuments/"

      - name: Upload executable
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: multipad4-${{ matrix.toolchain.id }}-x64-${{ matrix.simd }}
          path: cmake-${{ matrix.toolchain.id }}-build/package/
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: [build, mingw]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.ref_name }}
      RUN_ID: ${{ github.run_id }}

    steps:
      - name: Check out source and tag history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Download and package build artifacts
        shell: bash
        run: |
          set -euo pipefail
          gh run download "$RUN_ID" --pattern 'multipad4-*' --dir artifacts
          mkdir release-assets
          for artifact in artifacts/multipad4-*; do
            name=$(basename "$artifact")
            (cd "$artifact" && zip -r "../../release-assets/$name.zip" .)
          done

      - name: Generate release notes from commit messages
        shell: bash
        run: |
          set -euo pipefail
          # Exclude the current tag; the first release includes the entire history.
          if previous_tag=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null); then
            revision_range="$previous_tag..HEAD"
          else
            revision_range=HEAD
          fi
          git log --reverse --format='- %s%n%w(0,2,2)%b%w(0,0,0)' \
            --end-of-options "$revision_range" -- > release-notes.md

      - name: Create or update GitHub Release
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --notes-file release-notes.md
            gh release upload "$RELEASE_TAG" release-assets/*.zip --clobber
          else
            gh release create "$RELEASE_TAG" release-assets/*.zip \
              --verify-tag --title "$RELEASE_TAG" --notes-file release-notes.md
          fi
